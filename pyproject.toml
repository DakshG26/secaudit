[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secaudit"
version = "1.0.0"
description = "Authorized, non-destructive security auditor for AI-generated web applications"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
secaudit = "secaudit.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["secaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
