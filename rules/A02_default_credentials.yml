id: "A02-DEFAULTCRED-001"
title: "Default or Weak Credentials"
owasp: "A02"
owasp_name: "Security Misconfiguration"
cwe: "CWE-1392"
severity: "critical"
confidence: "likely"
exploitability: "trivial"
type: "regex"
pattern: "(?:password|passwd|pwd|secret|credential)\\s*[=:]\\s*['\"](?:admin|password|123456|test|secret|changeme|default|root|letmein|qwerty|pass)['\"]"
file_extensions: ["py", "js", "ts", "yml", "yaml", "json", "env", "cfg", "ini"]
flags: "IGNORECASE"
impact: "Known weak credentials allow trivial authentication bypass. These are the first passwords attackers try."
fix: "Use strong, randomly generated secrets loaded from environment variables."
fixed_code: |
  # Before (vulnerable):
  PASSWORD = "admin"

  # After (fixed):
  import os
  PASSWORD = os.environ["ADMIN_PASSWORD"]  # set via secret manager
