id: "A01-NOAUTH-001"
title: "Route with No Authentication"
owasp: "A01"
owasp_name: "Broken Access Control"
cwe: "CWE-306"
severity: "critical"
confidence: "likely"
exploitability: "trivial"
type: "route"
impact: "Any unauthenticated user can access this endpoint and its data."
fix: "Add an authentication decorator (e.g. @login_required, @jwt_required) before the route handler."
fixed_code: |
  # Before (vulnerable):
  @app.route('/admin')
  def admin_panel():
      return jsonify(admin_data)

  # After (fixed):
  @app.route('/admin')
  @login_required
  def admin_panel():
      return jsonify(admin_data)

# Routes matching these path fragments are considered sensitive
sensitive_path_patterns:
  - "admin"
  - "internal"
  - "manage"
  - "dashboard"
  - "settings"
  - "config"
  - "debug"
  - "superuser"
  - "root"
