id: "A04-SECRET-001"
title: "Hardcoded Secret or API Key"
owasp: "A04"
owasp_name: "Cryptographic Failures"
cwe: "CWE-798"
severity: "high"
confidence: "likely"
exploitability: "trivial"
type: "regex"
# High-entropy string pattern with secret-adjacent variable names
pattern: "(?:secret[_-]?key|api[_-]?key|auth[_-]?token|access[_-]?token|private[_-]?key|password|passwd|db[_-]?pass(?:word)?|database[_-]?url|jwt[_-]?secret)\\s*[=:]\\s*['\"]([^'\"]{8,})['\"]"
file_extensions: ["py", "js", "ts", "env", "yml", "yaml", "json", "cfg", "ini", "toml"]
flags: "IGNORECASE"
entropy_threshold: 3.5
redact_in_output: true
impact: |
  Hardcoded secrets committed to source control are trivially discoverable by anyone
  with repository access, or via git history even after deletion.
fix: "Move secrets to environment variables or a secret manager. Add .env to .gitignore."
fixed_code: |
  # Before (vulnerable):
  SECRET_KEY = "my-super-secret-key-1234"

  # After (fixed):
  import os
  SECRET_KEY = os.environ["SECRET_KEY"]
