id: "A04-WEAKHASH-001"
title: "MD5 or SHA1 Used for Password Hashing"
owasp: "A04"
owasp_name: "Cryptographic Failures"
cwe: "CWE-916"
severity: "high"
confidence: "likely"
exploitability: "easy"
type: "regex"
pattern: "hashlib\\.(?:md5|sha1)\\s*\\(|MD5\\(|SHA1\\("
file_extensions: ["py", "js", "ts"]
flags: "IGNORECASE"
impact: |
  MD5 and SHA1 are fast hash functions not designed for password storage.
  An attacker with the hash database can crack most passwords in minutes
  using a GPU and rainbow tables.
fix: "Use bcrypt, scrypt, or PBKDF2-SHA256 with a per-user salt and high iteration count."
fixed_code: |
  # Before (vulnerable):
  hashed = hashlib.md5(password.encode()).hexdigest()

  # After (fixed — using PBKDF2):
  import hashlib, os
  salt = os.urandom(16)
  hashed = hashlib.pbkdf2_hmac('sha256', password.encode(), salt, 260000)
